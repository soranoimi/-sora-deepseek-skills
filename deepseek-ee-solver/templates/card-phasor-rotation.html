<!-- 模板 template：相量转动动画 / Phasor rotation card
     用法：复制为 visualize 工具的 fragment（先加载 visualize 技能）。
     两个相量 İ₁、İ₂ 同步旋转（ωt 可拖动/自动播放），虚线头尾相加得到和相量 İ。
     默认值对应作业题：İ₁=8∠−120°、İ₂=4∠−120° → İ=12∠−120°。 -->
<div id="ee-phasor">
  <div class="viz-controls">
    <label class="form-label">İ₁ 幅值
      <input id="ph-a1" class="form-control" type="range" min="1" max="20" step="0.5" value="8">
      <span class="text-small" id="ph-a1-v">8</span>
    </label>
    <label class="form-label">İ₁ 初相/°
      <input id="ph-p1" class="form-control" type="range" min="-180" max="180" step="5" value="-120">
      <span class="text-small" id="ph-p1-v">−120</span>
    </label>
    <label class="form-label">İ₂ 幅值
      <input id="ph-a2" class="form-control" type="range" min="1" max="20" step="0.5" value="4">
      <span class="text-small" id="ph-a2-v">4</span>
    </label>
    <label class="form-label">İ₂ 初相/°
      <input id="ph-p2" class="form-control" type="range" min="-180" max="180" step="5" value="-120">
      <span class="text-small" id="ph-p2-v">−120</span>
    </label>
    <label class="form-label">ωt / °
      <input id="ph-t" class="form-control" type="range" min="0" max="360" step="2" value="0">
      <span class="text-small" id="ph-t-v">0</span>
    </label>
    <label class="form-check"><input id="ph-play" type="checkbox"> 自动旋转</label>
  </div>
  <div class="viz-row" style="gap:18px;margin:6px 0 10px;">
    <span class="viz-stat"><span class="viz-stat-value" id="ph-I1">8 A</span><span class="text-small">|İ₁|</span></span>
    <span class="viz-stat"><span class="viz-stat-value" id="ph-I2">4 A</span><span class="text-small">|İ₂|</span></span>
    <span class="viz-stat"><span class="viz-stat-value" id="ph-Is">12 A</span><span class="text-small">|İ| = |İ₁ + İ₂|</span></span>
    <span class="viz-stat"><span class="viz-stat-value" id="ph-dp">0°</span><span class="text-small">相位差 ψ₁ − ψ₂</span></span>
  </div>
  <svg id="ph-svg" role="img" aria-label="相量图"></svg>
</div>

<style>
#ee-phasor svg { display: block; width: 100%; height: auto; }
#ee-phasor svg text { font-family: var(--font-sans); }
</style>

<script>
(function () {
  var svg = document.getElementById('ph-svg');
  var C1 = 'var(--viz-series-1)', C2 = 'var(--viz-series-2)', C3 = 'var(--viz-series-3)';
  var MG = 'var(--muted-foreground)', GR = 'var(--viz-grid)', AX = 'var(--viz-axis)';

  function draw() {
    var a1 = +document.getElementById('ph-a1').value;
    var a2 = +document.getElementById('ph-a2').value;
    var p1 = +document.getElementById('ph-p1').value * Math.PI / 180;
    var p2 = +document.getElementById('ph-p2').value * Math.PI / 180;
    var wt = +document.getElementById('ph-t').value * Math.PI / 180;
    var W = svg.clientWidth || 560, H = Math.round(W * 0.72);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var cx = W / 2, cy = H / 2;
    var scale = (Math.min(W, H) / 2 - 46) / ((a1 + a2) * 1.15);
    var s = '';
    // 参考轴
    s += '<line x1="' + (cx - (a1 + a2) * scale - 18) + '" y1="' + cy + '" x2="' + (cx + (a1 + a2) * scale + 18) + '" y2="' + cy + '" style="stroke:' + AX + '" stroke-width="1.5"/>';
    s += '<line x1="' + cx + '" y1="' + (cy + (a1 + a2) * scale + 18) + '" x2="' + cx + '" y2="' + (cy - (a1 + a2) * scale - 18) + '" style="stroke:' + AX + '" stroke-width="1.5"/>';
    // 幅值环（网格）
    [0.5, 1.0].forEach(function (k) {
      var r = (a1 + a2) * scale * k;
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" style="stroke:' + GR + '" stroke-width="1"/>';
    });
    function vec(mag, ang, color, label, dash) {
      var r = mag * scale;
      var ex = cx + r * Math.cos(ang), ey = cy - r * Math.sin(ang);
      var dashAttr = dash ? ' stroke-dasharray="6 4"' : '';
      var s1 = '<line x1="' + cx + '" y1="' + cy + '" x2="' + ex.toFixed(1) + '" y2="' + ey.toFixed(1) + '" style="stroke:' + color + '" stroke-width="2.4"' + dashAttr + '/>';
      var hx = Math.cos(ang), hy = -Math.sin(ang);
      var px1 = ex - 9 * Math.cos(ang - 0.42), py1 = ey - 9 * (-Math.sin(ang - 0.42));
      var px2 = ex - 9 * Math.cos(ang + 0.42), py2 = ey - 9 * (-Math.sin(ang + 0.42));
      s1 += '<polyline points="' + px1.toFixed(1) + ',' + py1.toFixed(1) + ' ' + ex.toFixed(1) + ',' + ey.toFixed(1) + ' ' + px2.toFixed(1) + ',' + py2.toFixed(1) + '" fill="none" style="stroke:' + color + '" stroke-width="2.4"/>';
      var tx = ex + 10 * Math.cos(ang), ty = ey - 10 * Math.sin(ang) + 4;
      s1 += '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" text-anchor="' + (Math.cos(ang) < 0 ? 'end' : 'start') + '" font-size="12" font-weight="bold" style="fill:' + color + '">' + label + '</text>';
      return s1;
    }
    var th1 = wt + p1, th2 = wt + p2;
    // 头尾相加：İ₂ 起点平移到 İ₁ 端点（虚线），和相量从原点
    var e1x = cx + a1 * scale * Math.cos(th1), e1y = cy - a1 * scale * Math.sin(th1);
    var e2x = e1x + a2 * scale * Math.cos(th2), e2y = e1y - a2 * scale * Math.sin(th2);
    s += '<line x1="' + e1x.toFixed(1) + '" y1="' + e1y.toFixed(1) + '" x2="' + e2x.toFixed(1) + '" y2="' + e2y.toFixed(1) + '" style="stroke:' + C2 + '" stroke-width="2.4" stroke-dasharray="6 4"/>';
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e2x.toFixed(1) + '" y2="' + e2y.toFixed(1) + '" style="stroke:' + C3 + '" stroke-width="3"/>';
    s += vec(a1, th1, C1, 'İ₁', false);
    s += vec(a2, th2, C2, 'İ₂', false);
    var sm = Math.hypot(e2x - cx, e2y - cy) / scale;
    var sAng = Math.atan2(cy - e2y, e2x - cx);
    var tx = e2x + 12 * Math.cos(sAng), ty = e2y - 12 * Math.sin(sAng) + 4;
    s += '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" text-anchor="' + (Math.cos(sAng) < 0 ? 'end' : 'start') + '" font-size="12" font-weight="bold" style="fill:' + C3 + '">İ</text>';
    svg.innerHTML = s;
    // 统计
    document.getElementById('ph-I1').textContent = a1 + ' A';
    document.getElementById('ph-I2').textContent = a2 + ' A';
    document.getElementById('ph-Is').textContent = sm.toFixed(2) + ' A';
    var dp = +document.getElementById('ph-p1').value - +document.getElementById('ph-p2').value;
    document.getElementById('ph-dp').textContent = (dp > 0 ? '+' : '') + dp + '°';
  }

  [['ph-a1', 'ph-a1-v'], ['ph-a2', 'ph-a2-v'], ['ph-p1', 'ph-p1-v'], ['ph-p2', 'ph-p2-v'], ['ph-t', 'ph-t-v']].forEach(function (pair) {
    var el = document.getElementById(pair[0]);
    el.addEventListener('input', function () {
      var v = +el.value;
      document.getElementById(pair[1]).textContent = (v < 0 ? '−' : '') + Math.abs(v);
      draw();
    });
  });
  var raf = null;
  function spin() {
    var t = document.getElementById('ph-t');
    t.value = (+t.value + 1) % 360;
    document.getElementById('ph-t-v').textContent = t.value;
    draw();
    if (document.getElementById('ph-play').checked) { raf = requestAnimationFrame(spin); }
  }
  document.getElementById('ph-play').addEventListener('change', function () {
    if (this.checked) { raf = requestAnimationFrame(spin); } else if (raf) { cancelAnimationFrame(raf); }
  });
  var ro = new ResizeObserver(function () { draw(); });
  ro.observe(svg);
  draw();
})();
</script>
