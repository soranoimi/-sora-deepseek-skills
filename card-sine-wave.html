<!-- 模板 template：正弦波形动画 / Sine-wave animation card
     用法：复制为 visualize 工具的 fragment（先加载 visualize 技能）。
     可按需替换默认值：频率 f=50Hz、幅值 Iₘ=12A、初相 −120°（i₂ 幅值固定 0.6·Iₘ）。
     中文标注，可改英文。遵守契约：theme 变量、≥11px、无网络请求。 -->
<div id="ee-sine-wave">
  <div class="viz-controls">
    <label class="form-label">频率 f / Hz
      <input id="sw-f" class="form-control" type="range" min="10" max="200" step="5" value="50">
      <span class="text-small" id="sw-f-v">50</span>
    </label>
    <label class="form-label">幅值 Iₘ / A
      <input id="sw-a" class="form-control" type="range" min="1" max="20" step="0.5" value="12">
      <span class="text-small" id="sw-a-v">12</span>
    </label>
    <label class="form-label">初相 ψ₁ / °
      <input id="sw-p1" class="form-control" type="range" min="-180" max="180" step="5" value="-120">
      <span class="text-small" id="sw-p1-v">−120</span>
    </label>
    <label class="form-label">初相 ψ₂ / °
      <input id="sw-p2" class="form-control" type="range" min="-180" max="180" step="5" value="-120">
      <span class="text-small" id="sw-p2-v">−120</span>
    </label>
    <label class="form-check"><input id="sw-show2" type="checkbox" checked> 显示 i₂（幅值 0.6Iₘ）</label>
  </div>
  <div class="viz-row" style="gap:18px;margin:6px 0 10px;">
    <span class="viz-stat"><span class="viz-stat-value" id="st-I">8.49 A</span><span class="text-small">有效值 I = Iₘ/√2</span></span>
    <span class="viz-stat"><span class="viz-stat-value" id="st-T">20 ms</span><span class="text-small">周期 T = 1/f</span></span>
    <span class="viz-stat"><span class="viz-stat-value" id="st-dp">0°</span><span class="text-small">相位差 Δψ = ψ₁ − ψ₂</span></span>
  </div>
  <svg id="sw-svg" role="img" aria-label="正弦波形图"></svg>
</div>

<style>
#ee-sine-wave svg { display: block; width: 100%; height: auto; }
#ee-sine-wave svg text { font-family: var(--font-sans); }
#ee-sine-wave .ee-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ee-sweep .6s ease-out forwards; }
@keyframes ee-sweep { to { stroke-dashoffset: 0; } }
</style>

<script>
(function () {
  var root = document.getElementById('ee-sine-wave');
  var svg = document.getElementById('sw-svg');
  var C1 = 'var(--viz-series-1)', C2 = 'var(--viz-series-2)';
  var MG = 'var(--muted-foreground)', GR = 'var(--viz-grid)', AX = 'var(--viz-axis)';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var entered = false;

  function esc(s) { return String(s); }

  function draw() {
    var f = +document.getElementById('sw-f').value;
    var A = +document.getElementById('sw-a').value;
    var p1 = +document.getElementById('sw-p1').value * Math.PI / 180;
    var p2 = +document.getElementById('sw-p2').value * Math.PI / 180;
    var show2 = document.getElementById('sw-show2').checked;
    var W = svg.clientWidth || 640, H = Math.round(W * 0.52);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var mL = 56, mR = 16, mT = 24, mB = 36;
    var pw = W - mL - mR, ph = H - mT - mB;
    var T = 1 / f, w = 2 * Math.PI * f;
    var ymax = 1.25 * A, ymin = -ymax;
    function px(t) { return mL + pw * t / T; }
    function py(v) { return mT + ph * (ymax - v) / (ymax - ymin); }
    var s = '';
    var i, v, t;
    for (i = 0; i <= 5; i++) {                       // 网格线仅沿数值轴（whale 风格）
      v = ymin + (ymax - ymin) * i / 5;
      s += '<line x1="' + mL + '" y1="' + py(v).toFixed(1) + '" x2="' + (mL + pw) + '" y2="' + py(v).toFixed(1) +
           '" style="stroke:' + GR + '" stroke-width="1"/>';
      s += '<text x="' + (mL - 6) + '" y="' + (py(v) + 3.5).toFixed(1) + '" text-anchor="end" font-size="11" style="fill:' + MG + '">' + v.toFixed(1) + '</text>';
    }
    for (i = 0; i <= 6; i++) {
      t = T * i / 6;
      s += '<text x="' + px(t).toFixed(1) + '" y="' + (mT + ph + 16) + '" text-anchor="middle" font-size="11" style="fill:' + MG + '">' + (t * 1000).toFixed(1) + '</text>';
    }
    s += '<line x1="' + mL + '" y1="' + py(0).toFixed(1) + '" x2="' + (mL + pw) + '" y2="' + py(0).toFixed(1) + '" style="stroke:' + AX + '" stroke-width="1.5"/>';
    s += '<line x1="' + mL + '" y1="' + (mT + ph) + '" x2="' + mL + '" y2="' + mT + '" style="stroke:' + AX + '" stroke-width="1.5"/>';
    s += '<text x="' + (mL + pw) + '" y="' + (py(0) + 16).toFixed(1) + '" text-anchor="end" font-size="11" style="fill:' + MG + '">t/ms</text>';
    s += '<text x="' + (mL - 6) + '" y="' + (mT - 7) + '" text-anchor="end" font-size="11" style="fill:' + MG + '">i/A</text>';
    function curve(amp, ph, color, dash, id) {
      var d = '';
      for (i = 0; i <= 240; i++) {
        t = T * i / 240;
        var X = px(t), Y = py(amp * Math.sin(w * t + ph));
        d += (i ? 'L' : 'M') + X.toFixed(1) + ' ' + Y.toFixed(1);
      }
      var dashAttr = dash ? ' stroke-dasharray="5 4"' : '';
      var anim = (!entered && !reduce && id === 'c1') ? ' pathLength="1" class="ee-draw"' : '';
      return '<path d="' + d + '" fill="none" style="stroke:' + color + '" stroke-width="2"' + dashAttr + anim + '/>';
    }
    s += curve(A, p1, C1, false, 'c1');
    if (show2) { s += curve(0.6 * A, p2, C2, true, 'c2'); }
    function deg(sgn) { return sgn >= 0 ? '+' : '−'; }
    s += '<text x="' + (mL + pw - 8) + '" y="' + (mT + 14) + '" text-anchor="end" font-size="12" style="fill:' + C1 + '">i₁ = ' + A.toFixed(1) + ' sin(ωt ' + deg(+document.getElementById('sw-p1').value) + Math.abs(+document.getElementById('sw-p1').value) + '°)</text>';
    if (show2) {
      s += '<text x="' + (mL + pw - 8) + '" y="' + (mT + 30) + '" text-anchor="end" font-size="12" style="fill:' + C2 + '">i₂ = ' + (0.6 * A).toFixed(1) + ' sin(ωt ' + deg(+document.getElementById('sw-p2').value) + Math.abs(+document.getElementById('sw-p2').value) + '°)</text>';
    }
    svg.innerHTML = s;
    entered = true;
    document.getElementById('st-I').textContent = (A / Math.SQRT2).toFixed(2) + ' A';
    document.getElementById('st-T').textContent = (T * 1000).toFixed(1) + ' ms';
    var dp = +document.getElementById('sw-p1').value - +document.getElementById('sw-p2').value;
    document.getElementById('st-dp').textContent = (dp > 0 ? '+' : '') + dp + '°';
  }

  [['sw-f', 'sw-f-v'], ['sw-a', 'sw-a-v'], ['sw-p1', 'sw-p1-v'], ['sw-p2', 'sw-p2-v']].forEach(function (pair) {
    var el = document.getElementById(pair[0]);
    el.addEventListener('input', function () {
      var v = +el.value;
      document.getElementById(pair[1]).textContent = (v < 0 ? '−' : '') + Math.abs(v);
      draw();
    });
  });
  document.getElementById('sw-show2').addEventListener('change', draw);
  var ro = new ResizeObserver(function () { draw(); });
  ro.observe(svg);
  draw();
})();
</script>
