<!-- 模板 template：RLC 串/并联计算演示 / RLC series-parallel demo card
     用法：复制为 visualize 工具的 fragment（先加载 visualize 技能）。
     调节 R、L、C、f、U 与接法，实时给出 Z、I、各元件电压/支路电流、P/Q/S/cosφ，
     并绘制电路示意图与阻抗三角形；接近谐振时给出提示。 -->
<div id="ee-rlc">
  <div class="viz-controls">
    <label class="form-label">接法
      <select id="rlc-kind" class="form-select">
        <option value="series" selected>串联 series</option>
        <option value="parallel">并联 parallel</option>
      </select>
    </label>
    <label class="form-label">R / Ω
      <input id="rlc-r" class="form-control" type="range" min="1" max="200" step="1" value="30">
      <span class="text-small" id="rlc-r-v">30</span>
    </label>
    <label class="form-label">L / mH
      <input id="rlc-l" class="form-control" type="range" min="1" max="500" step="1" value="127">
      <span class="text-small" id="rlc-l-v">127</span>
    </label>
    <label class="form-label">C / μF
      <input id="rlc-c" class="form-control" type="range" min="1" max="200" step="1" value="40">
      <span class="text-small" id="rlc-c-v">40</span>
    </label>
    <label class="form-label">f / Hz
      <input id="rlc-f" class="form-control" type="range" min="10" max="500" step="1" value="50">
      <span class="text-small" id="rlc-f-v">50</span>
    </label>
    <label class="form-label">U / V（有效值）
      <input id="rlc-u" class="form-control" type="range" min="10" max="400" step="1" value="220">
      <span class="text-small" id="rlc-u-v">220</span>
    </label>
  </div>
  <div class="viz-row" style="gap:18px;margin:6px 0 10px;flex-wrap:wrap;">
    <span class="viz-stat"><span class="viz-stat-value" id="rlc-z">54.0 Ω</span><span class="text-small">|Z| 阻抗</span></span>
    <span class="viz-stat"><span class="viz-stat-value" id="rlc-i">4.07 A</span><span class="text-small">I 电流</span></span>
    <span class="viz-stat"><span class="viz-stat-value" id="rlc-cos">0.56</span><span class="text-small">cosφ 功率因数</span></span>
    <span class="viz-stat"><span class="viz-stat-value" id="rlc-nature">感性</span><span class="text-small">电路性质</span></span>
  </div>
  <div class="viz-grid" style="grid-template-columns:1fr 1fr;gap:12px;align-items:start;">
    <div class="card">
      <div class="text-small" style="margin-bottom:6px;">电路示意图 Circuit</div>
      <svg id="rlc-circuit" role="img" aria-label="电路示意图"></svg>
    </div>
    <div class="card">
      <div class="text-small" style="margin-bottom:6px;">阻抗三角形 Impedance triangle（R, X, |Z|）</div>
      <svg id="rlc-tri" role="img" aria-label="阻抗三角形"></svg>
    </div>
  </div>
  <div class="card" style="margin-top:12px;">
    <div class="text-small" style="margin-bottom:4px;">计算结果 Results</div>
    <div id="rlc-rows" style="font-variant-numeric:tabular-nums;font-size:13px;line-height:1.7;"></div>
  </div>
</div>

<style>
#ee-rlc svg { display: block; width: 100%; height: auto; }
#ee-rlc svg text { font-family: var(--font-sans); }
#ee-rlc .viz-grid { display: grid; }
@media (max-width: 720px) { #ee-rlc .viz-grid { grid-template-columns: 1fr; } }
</style>

<script>
(function () {
  var C1 = 'var(--viz-series-1)', C2 = 'var(--viz-series-2)', C3 = 'var(--viz-series-3)';
  var MG = 'var(--muted-foreground)', FG = 'var(--foreground)', GR = 'var(--viz-grid)', AX = 'var(--viz-axis)';

  function n2(x) { return (Math.abs(x) < 1e-9 ? 0 : x).toFixed(2); }

  function draw() {
    var kind = document.getElementById('rlc-kind').value;
    var R = +document.getElementById('rlc-r').value;
    var L = +document.getElementById('rlc-l').value / 1000;
    var C = +document.getElementById('rlc-c').value / 1e6;
    var f = +document.getElementById('rlc-f').value;
    var U = +document.getElementById('rlc-u').value;
    var w = 2 * Math.PI * f;
    var XL = w * L, XC = 1 / (w * C), X = XL - XC;

    // ---- 计算
    var Z, I, UR, UL, UC, IR, IL, IC, P, Q, S;
    if (kind === 'series') {
      Z = Math.hypot(R, X); I = U / Z;
      UR = I * R; UL = I * XL; UC = I * XC;
      P = I * I * R; Q = I * I * X; S = U * I;
    } else {
      IR = U / R; IL = U / XL; IC = U * w * C;
      I = Math.hypot(IR, IC - IL); Z = U / I;
      P = U * U / R; Q = U * U * (1 / XC - 1 / XL); S = U * I;
    }
    var cos = S > 1e-9 ? P / S : 0;
    var nature = (Math.abs(X) < Math.max(0.01, 0.005 * (XL + XC))) ? '阻性（近谐振）'
      : (X > 0 ? '感性 inductive' : '容性 capacitive');

    document.getElementById('rlc-z').textContent = n2(Z) + ' Ω';
    document.getElementById('rlc-i').textContent = n2(I) + ' A';
    document.getElementById('rlc-cos').textContent = n2(cos);
    document.getElementById('rlc-nature').textContent = nature;

    var rows = 'Z = ' + n2(Z) + ' Ω' +
      '，X<sub>L</sub> = ' + n2(XL) + ' Ω，X<sub>C</sub> = ' + n2(XC) + ' Ω<br>';
    if (kind === 'series') {
      rows += 'U<sub>R</sub> = ' + n2(UR) + ' V，U<sub>L</sub> = ' + n2(UL) + ' V，U<sub>C</sub> = ' + n2(UC) + ' V<br>';
    } else {
      rows += 'I<sub>R</sub> = ' + n2(IR) + ' A，I<sub>L</sub> = ' + n2(IL) + ' A，I<sub>C</sub> = ' + n2(IC) + ' A<br>';
    }
    rows += 'P = ' + n2(P) + ' W，Q = ' + n2(Q) + ' var，S = ' + n2(S) + ' V·A<br>';
    var f0 = 1 / (2 * Math.PI * Math.sqrt(L * C));
    rows += '谐振频率 f₀ = 1/(2π√LC) = ' + (f0 >= 1e6 ? (f0 / 1e6).toFixed(2) + ' MHz' : f0 >= 1000 ? (f0 / 1000).toFixed(2) + ' kHz' : f0.toFixed(1) + ' Hz');
    if (Math.abs(f - f0) / f0 < 0.15) { rows += '　⚠ 当前接近谐振'; }
    document.getElementById('rlc-rows').innerHTML = rows;

    drawCircuit(kind);
    drawTriangle(R, X, Z);
  }

  function drawCircuit(kind) {
    var svg = document.getElementById('rlc-circuit');
    var W = svg.clientWidth || 240, H = Math.round(W * 0.75);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('viewBox', '0 0 240 180');
    var s = '';
    if (kind === 'series') {
      s += '<polyline points="30,40 210,40 210,140 30,140 30,40" fill="none" style="stroke:' + FG + '" stroke-width="2"/>';
      s += '<circle cx="30" cy="90" r="12" fill="none" style="stroke:' + FG + '" stroke-width="2"/>';
      s += '<path d="M24,82 Q30,76 36,82 M24,98 Q30,104 36,98" fill="none" style="stroke:' + FG + '" stroke-width="2"/>';
      s += elem('rect', 52, 24, 76, 56, 'R', C1);
      s += elem('coil', 82, 40, 128, 40, 'L', C2);
      s += elem('cap', 134, 40, 176, 40, 'C', C3);
      s += '<polyline points="200,140 214,140 200,132 214,140 200,148" fill="none" style="stroke:' + C1 + '" stroke-width="2"/>';
      s += '<text x="207" y="158" font-size="11" style="fill:' + C1 + '">İ</text>';
    } else {
      s += '<line x1="50" y1="45" x2="50" y2="155" style="stroke:' + FG + '" stroke-width="2"/>';
      s += '<line x1="190" y1="45" x2="190" y2="155" style="stroke:' + FG + '" stroke-width="2"/>';
      [55, 95, 135].forEach(function (y, i) {
        s += '<line x1="50" y1="' + y + '" x2="66" y2="' + y + '" style="stroke:' + FG + '" stroke-width="2"/>';
        s += '<line x1="174" y1="' + y + '" x2="190" y2="' + y + '" style="stroke:' + FG + '" stroke-width="2"/>';
        var c = i === 0 ? C1 : i === 1 ? C2 : C3;
        var lb = i === 0 ? 'R' : i === 1 ? 'L' : 'C';
        if (i === 0) { s += elem('rect', 66, y - 16, 174, y + 16, lb, c); }
        if (i === 1) { s += elem('coil', 66, y, 174, y, lb, c); }
        if (i === 2) { s += elem('cap', 66, y, 174, y, lb, c); }
      });
      s += '<line x1="50" y1="155" x2="50" y2="180" style="stroke:' + FG + '" stroke-width="2"/>';
      s += '<line x1="190" y1="155" x2="190" y2="180" style="stroke:' + FG + '" stroke-width="2"/>';
      s += '<circle cx="120" cy="180" r="12" fill="none" style="stroke:' + FG + '" stroke-width="2"/>';
      s += '<path d="M114,172 Q120,166 126,172 M114,188 Q120,194 126,188" fill="none" style="stroke:' + FG + '" stroke-width="2"/>';
    }
    svg.innerHTML = s;
  }

  function elem(t, x1, y1, x2, y2, label, color) {
    var s = '';
    if (t === 'rect') {
      var hw = 9, hh = 10;
      var cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
      s += '<rect x="' + (cx - 8) + '" y="' + (cy - hh) + '" width="16" height="' + (2 * hh) + '" fill="none" style="stroke:' + color + '" stroke-width="2"/>';
      s += '<line x1="' + x1 + '" y1="' + cy + '" x2="' + cx + '" y2="' + cy + '" style="stroke:' + color + '" stroke-width="2"/>';
      s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x2 + '" y2="' + cy + '" style="stroke:' + color + '" stroke-width="2"/>';
    } else if (t === 'coil') {
      var d = (x2 - x1) / 4, r = d / 2, c0 = x1 + r, cy = y1;
      s += '<line x1="' + x1 + '" y1="' + cy + '" x2="' + c0 + '" y2="' + cy + '" style="stroke:' + color + '" stroke-width="2"/>';
      for (var i = 0; i < 4; i++) {
        var cx2 = c0 + d * i;
        var sw = (i % 2 === 0) ? '1' : '0';
        s += '<path d="M' + (cx2 - r) + ',' + cy + ' A' + r + ',' + r + ' 0 0 ' + sw + ' ' + (cx2 + r) + ',' + cy + '" fill="none" style="stroke:' + color + '" stroke-width="2"/>';
      }
      s += '<line x1="' + (c0 + d * 4) + '" y1="' + cy + '" x2="' + x2 + '" y2="' + cy + '" style="stroke:' + color + '" stroke-width="2"/>';
    } else if (t === 'cap') {
      var cx3 = (x1 + x2) / 2, cy3 = (y1 + y2) / 2;
      s += '<line x1="' + x1 + '" y1="' + cy3 + '" x2="' + (cx3 - 3) + '" y2="' + cy3 + '" style="stroke:' + color + '" stroke-width="2"/>';
      s += '<line x1="' + (cx3 + 3) + '" y1="' + cy3 + '" x2="' + x2 + '" y2="' + cy3 + '" style="stroke:' + color + '" stroke-width="2"/>';
      s += '<line x1="' + (cx3 - 3) + '" y1="' + (cy3 - 10) + '" x2="' + (cx3 - 3) + '" y2="' + (cy3 + 10) + '" style="stroke:' + color + '" stroke-width="2"/>';
      s += '<line x1="' + (cx3 + 3) + '" y1="' + (cy3 - 10) + '" x2="' + (cx3 + 3) + '" y2="' + (cy3 + 10) + '" style="stroke:' + color + '" stroke-width="2"/>';
    }
    s += '<text x="' + ((x1 + x2) / 2) + '" y="' + ((y1 + y2) / 2 + 22) + '" text-anchor="middle" font-size="11" style="fill:' + color + '">' + label + '</text>';
    return s;
  }

  function drawTriangle(R, X, Z) {
    var svg = document.getElementById('rlc-tri');
    var W = svg.clientWidth || 240, H = Math.round(W * 0.75);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('viewBox', '0 0 240 170');
    var ox = 34, oy = 140, mx = 190;
    var k = (mx - ox) / Math.max(R, Math.abs(X), 1e-9) * 0.92;
    var Rx = R * k, Xx = X * k, Zx = Z * k;
    var s = '';
    s += '<line x1="' + ox + '" y1="' + oy + '" x2="' + mx + '" y2="' + oy + '" style="stroke:' + AX + '" stroke-width="1.5"/>';
    s += '<line x1="' + ox + '" y1="' + oy + '" x2="' + (ox + Rx) + '" y2="' + (oy - Xx) + '" style="stroke:' + C1 + '" stroke-width="2"/>';
    s += '<line x1="' + (ox + Rx) + '" y1="' + oy + '" x2="' + (ox + Rx) + '" y2="' + (oy - Xx) + '" style="stroke:' + C2 + '" stroke-width="2"/>';
    s += '<line x1="' + ox + '" y1="' + oy + '" x2="' + (ox + Rx) + '" y2="' + (oy - Xx) + '" style="stroke:' + C3 + '" stroke-width="2.5"/>';
    s += '<text x="' + (ox + Rx / 2) + '" y="' + (oy + 16) + '" text-anchor="middle" font-size="11" style="fill:' + C1 + '">R=' + n2(R) + '</text>';
    var xmid = ox + Rx + 12, ymid = oy - Xx / 2;
    s += '<text x="' + xmid + '" y="' + ymid + '" font-size="11" style="fill:' + C2 + '">X=' + n2(X) + '</text>';
    s += '<text x="' + (ox + Rx / 2) + '" y="' + (oy - Xx / 2 - 8) + '" text-anchor="middle" font-size="11" style="fill:' + C3 + '">|Z|=' + n2(Z) + '</text>';
    if (Rx > 4) {
      var phi = Math.atan2(-Xx, Rx) * 180 / Math.PI;
      s += '<path d="M' + (ox + 18) + ',' + oy + ' A18,18 0 0 ' + (phi > 0 ? 1 : 0) + ' ' + (ox + 18 * Math.cos(phi * Math.PI / 180)) + ',' + (oy + 18 * Math.sin(phi * Math.PI / 180)) + '" fill="none" style="stroke:' + GR + '" stroke-width="1.2"/>';
      s += '<text x="' + (ox + 26) + '" y="' + (oy - 4) + '" font-size="11" style="fill:' + MG + '">φ</text>';
    }
    svg.innerHTML = s;
  }

  [['rlc-r', 'rlc-r-v'], ['rlc-l', 'rlc-l-v'], ['rlc-c', 'rlc-c-v'], ['rlc-f', 'rlc-f-v'], ['rlc-u', 'rlc-u-v']].forEach(function (pair) {
    var el = document.getElementById(pair[0]);
    el.addEventListener('input', function () {
      document.getElementById(pair[1]).textContent = el.value;
      draw();
    });
  });
  document.getElementById('rlc-kind').addEventListener('change', draw);
  ['rlc-circuit', 'rlc-tri'].forEach(function (id) {
    var ro = new ResizeObserver(function () { draw(); });
    ro.observe(document.getElementById(id));
  });
  draw();
})();
</script>
